<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film | POV: You're D2 Food</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>
<body class="film-page">

  <nav class="navbar">
    <a href="../">Home</a>
    <a href="../film/" class="current">Film</a>
    <a href="../team/">Team</a>
  </nav>

  <!-- Ready screen. Covers the page until the visitor presses Begin.
       This is the only place the rules are explained. -->
  <div id="intro" class="intro show">
    <h1>You are the food.</h1>
    <p class="intro-rules">
      Watch each chapter below. Once it ends, drag the plate<br>
      down to the next step. There is no going back.
    </p>
    <button id="begin-button" class="button">Begin</button>
  </div>

  <!-- One video for the whole film. script.js only lets it play one chapter at a time. -->
  <div class="video-box">
    <video id="film" src="../assets/film.mp4" controls preload="auto"></video>
    <p id="chapter-label" class="chapter-label">Chapter I: Chosen</p>
    <p id="instructions" class="instructions">Press play to watch the first chapter.</p>
  </div>

  <!-- The staircase. Each step is one chapter. The bin waits at the bottom. -->
  <div id="stairs" class="stairs">
    <div class="step" id="step-0"></div>
    <div class="step" id="step-1"></div>
    <div class="step" id="step-2"></div>
    <div class="step" id="step-3"></div>
    <div class="step" id="step-4"></div>
    <div class="step" id="step-5"></div>

    <img id="bin" class="bin" src="../assets/bin.jpg" alt="The general waste bin at D2" draggable="false">

    <!-- draggable="false" stops the browser's own image dragging so our code can move it -->
    <img id="plate" class="plate" src="../assets/plate.png" alt="A plate of food" draggable="false">
  </div>

  <!-- Ending screen. Hidden until the plate goes into the bin. -->
  <div id="ending" class="ending">
    <p class="ending-caption">Don't waste me.<br>Please eat me.</p>
    <button id="watch-again" class="button">Watch again</button>
  </div>

  <script src="../script.js"></script>
</body>
</html>
